# Publishes the app to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Give every deploy a fresh offline-cache name so installed apps pick up the new version.
      - name: Stamp service worker version
        run: sed -i "s/const VERSION = '[^']*'/const VERSION = 'cardroom-${GITHUB_SHA::8}'/" sw.js

      # Fail the deploy if any file the app needs is missing (offline cache list, scripts, styles, fonts).
      - name: Check site files
        run: node tools/check-site.js .

      - uses: actions/configure-pages@v5
      # Publish the whole repository (upload-pages-artifact already leaves out .git and .github).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
