# Publishes the app to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Give every deploy a fresh offline-cache name so installed apps pick up the new version.
      - name: Stamp service worker version
        run: sed -i "s/const VERSION = '[^']*'/const VERSION = 'cardroom-${GITHUB_SHA::8}'/" sw.js

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html styles.css *.js manifest.webmanifest icons vendor _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
